[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medspeech-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pydantic>=2.10,<3", "fastapi==0.115.12", "httpx==0.28.1", "python-multipart==0.0.20", "soundfile==0.13.1", "uvicorn==0.34.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
hf = ["huggingface-hub==1.24.0"]
full = ["torch==2.6.0", "transformers==4.49.0", "peft==0.14.0", "accelerate==1.4.0", "huggingface-hub>=0.28,<1", "uroman==1.3.1"]

[project.scripts]
medspeech = "medspeech.cli:main"

[tool.setuptools.packages.find]
include = ["medspeech*"]

[tool.setuptools.package-data]
medspeech = ["web/*.html", "web/*.css", "web/*.js", "cases/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
